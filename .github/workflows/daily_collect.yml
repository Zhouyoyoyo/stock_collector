name: daily-collect

on:
  workflow_dispatch:
    inputs:
      delete_all_artifacts:
        description: "删除仓库内所有 Actions artifacts（执行后不可恢复）"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  collect:
    name: collect-runner-1
    runs-on: ubuntu-latest
    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_FROM: ${{ secrets.SMTP_FROM }}
      ALERT_EMAIL_TO: ${{ secrets.SMTP_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      PHONE_NUM: ${{ secrets.PHONE_NUM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r stock_collector/requirements.txt

      - name: Install Playwright
        run: python -m playwright install --with-deps chromium

      - name: Restore CSV cache
        uses: actions/cache@v4
        with:
          path: stock_collector/data/csv/**
          key: stock-csv-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            stock-csv-${{ runner.os }}-

      - name: Check SMTP env injection (safe)
        run: |
          python - << 'EOF'
          import os
          keys = [
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USER",
              "SMTP_PASS",
              "ALERT_EMAIL_FROM",
              "ALERT_EMAIL_TO",
          ]
          for k in keys:
              print(f"[env-check] {k} =", "SET" if os.getenv(k) else "MISSING")
          EOF

      - name: Run collector
        run: python stock_collector/main.py --run

      - name: Delete all workflow artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.delete_all_artifacts == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            core.warning(`delete_all_artifacts=true，开始删除 ${owner}/${repo} 的全部 artifacts。`);
            let total = 0;
            const per_page = 100;

            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner,
                repo,
                page: 1,
                per_page,
              });

              if (!data.artifacts.length) {
                break;
              }

              for (const artifact of data.artifacts) {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
                total += 1;
                core.info(`已删除 artifact: ${artifact.name} (#${artifact.id})`);
              }

            }

            core.notice(`Artifacts 删除完成，共删除 ${total} 个。`);

  runner-check:
    name: collect-runner-2
    runs-on: ubuntu-latest
    steps:
      - name: Runner ready
        run: echo "Runner-2 is ready for manual dispatch workflows."
